name: Build encrypted payload

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - keyring.json
      - tools/encrypt-from-url.mjs
      - .github/workflows/build-encrypted-payload.yml

permissions:
  contents: write

jobs:
  encrypt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Encrypt current execution console
        run: node tools/encrypt-from-url.mjs "https://raw.githubusercontent.com/samlcy1997/testhtml/master/index.html" trip.enc.json
      - name: Commit ciphertext only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trip.enc.json
          if git diff --cached --quiet; then
            echo "No encrypted payload change"
          else
            git commit -m "Update encrypted payload"
            git push
          fi
